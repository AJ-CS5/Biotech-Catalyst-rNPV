[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalyst-rnpv"
version = "0.0.1"
description = "Pre-registered, risk-adjusted NPV (rNPV) valuation research for clinical-stage biotech assets"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "SALib>=1.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catalyst_rnpv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
