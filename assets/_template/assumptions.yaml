# Template assumptions file.
#
# Copy this folder to assets/<asset_id>/ and set asset_id to the new folder name;
# the loader rejects a file whose asset_id does not match its containing folder.
#
# Every parameter entry has exactly these eight fields, and no others:
#
#   value:         number or null
#   unit:          string
#   distribution:  null, or {type: <type>, params: {...}}
#   source_url:    string or null
#   source_type:   sec_filing | trial_registry | publication | cms_pricing |
#                  fda_document | icer_nice | company_pr | estimate
#   justification: non-empty string, always
#   status:        VERIFIED | UNVERIFIED | ESTIMATE | PLACEHOLDER
#   as_of:         ISO date (YYYY-MM-DD) or null
#
# Status rules enforced by the loader:
#   VERIFIED    -> source_url and as_of must both be non-null
#   ESTIMATE    -> source_type must be estimate
#   PLACEHOLDER -> value must be null
#
# Distribution types and their required params:
#   point             {}
#   bernoulli         {p}                     0 <= p <= 1
#   beta              {alpha, beta}           alpha > 0, beta > 0
#   pert              {low, mode, high}       low <= mode <= high
#   triangular        {low, mode, high}       low <= mode <= high
#   lognormal         {mu, sigma}             sigma > 0
#   shifted_lognormal {shift, mu, sigma}      sigma > 0
#   gamma             {shape, scale}          shape > 0, scale > 0
#
# Leave every parameter as a PLACEHOLDER until it has been sourced. Do not write a
# number here without a source_url, a source_type, and an as_of date.

