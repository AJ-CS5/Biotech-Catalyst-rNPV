name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project with dev dependencies
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q
